[project]
name = "vibe"
version = "0.1.0"
description = "A coding agent for learning agent development"
requires-python = ">=3.12"
dependencies = [
    "langgraph>=0.4",
    "langchain-core>=0.3",
    "langchain-openai>=0.3",
]

[project.scripts]
vibe = "vibe.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vibe"]

[tool.ruff]
line-length = 120

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
